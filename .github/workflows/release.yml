# ---------------------------------------------------------------------------
#  Vehistra - Version veröffentlichen
#
#  Läuft, sobald ein Versionsschild (Tag) der Form v1.0.0 gesetzt wird, und
#  kann zum Ausprobieren auch von Hand gestartet werden.
#
#  Der eigentliche Ablauf steckt in tools/ReleaseBuilder/CreateRelease.ps1 -
#  demselben Skript, das auch auf einem Arbeitsplatzrechner verwendet wird.
#  So wird genau der Weg geprüft, den die Anleitung beschreibt.
#
#  Entwickelt von LSP Virtual Services - vehistra.dev
# ---------------------------------------------------------------------------

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 1.0.0'
        required: true
        type: string
      draft:
        description: 'Nur als Entwurf anlegen'
        required: false
        default: true
        type: boolean
      vorabversion:
        description: 'Als Beta kennzeichnen (nur noch auf ausdruecklichen Wunsch)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Version bauen und veröffentlichen
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Inno Setup einrichten
        run: choco install innosetup --yes --no-progress

      - name: Versionsnummer bestimmen
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            # refs/tags/v0.5.0 -> 0.5.0
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::Die Versionsnummer '$version' entspricht nicht dem Muster HAUPT.NEBEN.KORREKTUR."
            exit 1
          }

          # Vorabversion ist alles unterhalb 1.0.0 - und alles, was beim Start
          # von Hand ausdruecklich als Beta gekennzeichnet wird. Auch eine
          # 1.0.0 kann eine Beta sein; das entscheidet nicht die Zahl.
          $vorab = ([int]($version -split '\.')[0]) -eq 0

          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.vorabversion }}' -eq 'true') {
            $vorab = $true
          }

          $bezeichnung = if ($vorab) { "Vehistra $version Beta" } else { "Vehistra $version" }

          "version=$version"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$($vorab.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "vorab=$($vorab.ToString().ToLower())"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$bezeichnung"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Version: $version (Vorabversion: $vorab)"

      # ---------------------------------------------------------------------
      #  Codesignatur ueber die SignPath Foundation.
      #
      #  Laeuft nur, wenn die Zugangsdaten als Secrets hinterlegt sind. Fehlen
      #  sie, wird unsigniert veroeffentlicht und der Lauf sagt das deutlich -
      #  statt still etwas Unsigniertes als signiert auszugeben.
      #
      #  Ein Zertifikat oder Schluessel liegt niemals im Repository; der
      #  private Schluessel verlaesst das HSM der Stiftung nicht.
      # ---------------------------------------------------------------------
      - name: Prüfen, ob signiert werden kann
        id: signatur
        shell: pwsh
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $moeglich = -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_TOKEN)

          "moeglich=$($moeglich.ToString().ToLower())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($moeglich) {
            Write-Host "Zugangsdaten vorhanden - die Pakete werden signiert."
          } else {
            Write-Host "::warning::Ohne SIGNPATH_API_TOKEN wird unsigniert veröffentlicht. Windows zeigt dann eine SmartScreen-Warnung."
          }

      - name: Versionshinweise vorbereiten
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'

          # Dieselbe Entscheidung wie im Schritt davor - nicht noch einmal geraten.
          $vorab = '${{ steps.version.outputs.vorab }}' -eq 'true'

          # Die Aenderungen dieser Version aus CHANGELOG.md uebernehmen.
          $neuerungen = ''

          if (Test-Path 'CHANGELOG.md') {
            $zeilen = Get-Content 'CHANGELOG.md'
            $start = -1

            for ($i = 0; $i -lt $zeilen.Count; $i++) {
              if ($zeilen[$i].Trim() -eq "## $version") { $start = $i + 1; break }
            }

            if ($start -ge 0) {
              $ende = $zeilen.Count

              for ($i = $start; $i -lt $zeilen.Count; $i++) {
                if ($zeilen[$i] -like '## *') { $ende = $i; break }
              }

              $abschnitt = ($zeilen[$start..($ende - 1)] -join "`n").Trim()

              if ($abschnitt) {
                $neuerungen = "WAS SICH GEAENDERT HAT`n" + ('-' * 25) + "`n$abschnitt`n"
              }
            }
          }

          if (-not $neuerungen) {
            Write-Host "::warning::In CHANGELOG.md gibt es keinen Abschnitt '## $version'."
          }

          # Nur behaupten, was zutrifft: ob signiert wird, steht im Schritt davor.
          $signatur = if ('${{ steps.signatur.outputs.moeglich }}' -eq 'true') {
            @"
          HINWEIS ZUR SIGNATUR
          Die Installationspakete sind von der SignPath Foundation signiert.
          Windows zeigt als Herausgeber "SignPath Foundation" an - im Auftrag
          von LSP Virtual Services. Die Pruefsummen stehen in checksums.sha256.
          "@
          } else {
            @"
          HINWEIS ZUR SIGNATUR
          Die Pakete sind noch nicht signiert. Windows zeigt daher beim Start
          eine SmartScreen-Warnung. Pruefen Sie die Pruefsumme aus
          checksums.sha256, bevor Sie auf "Trotzdem ausfuehren" klicken.
          "@
          }

          $hinweis = if ($vorab) {
            @"

          HINWEIS ZUR VORABVERSION
          Dies ist eine Beta. Die Anwendung ist vollstaendig und getestet, aber
          noch nicht im Dauerbetrieb erprobt. Setzen Sie sie zunaechst neben
          Ihrem bisherigen Verfahren ein und pruefen Sie die Sicherung, bevor
          Sie sich vollstaendig darauf verlassen.
          Rueckmeldungen bitte an support@vehistra.dev
          "@
          } else { "" }

          @"
          VEHISTRA $version
          Open Fleet Management - Vehicle · Driver · Maintenance · Compliance
          Veroeffentlicht am $(Get-Date -Format 'dd.MM.yyyy')
          Entwickelt und betreut von LSP Virtual Services - vehistra.dev

          $neuerungen
          INHALT DIESER AUSLIEFERUNG
          - Vehistra-Setup.exe        Erstinstallation eines Arbeitsplatzes
          - Vehistra-Update.exe       Updatepaket fuer vorhandene Installationen
          - Serverwerkzeuge\          VehistraServerSetup.exe, VehistraServerCheck.exe
          - Dokumentation\            die sechs Anleitungen als Markdown und PDF
          - latest.json               Beschreibung fuer die Updateablage
          - checksums.sha256          Pruefsummen aller Dateien

          HINWEISE ZUM UPDATE
          - Vor jeder Datenbankaenderung wird automatisch eine Sicherung erstellt.
          - Schlaegt die Sicherung fehl, wird das Update abgebrochen.
          - Es werden keine Daten geloescht; bestehende Daten bleiben erhalten.

          VORAUSSETZUNGEN
          - Windows 10 oder neuer (64 Bit)
          - .NET Desktop Runtime 10
          - Im Netzwerkbetrieb zusaetzlich Microsoft SQL Server Express auf dem
            Firmenserver. Der Solo-Platz braucht nichts davon - dort ist die
            Datenbank eine Datei auf diesem Computer.

          ANFANGEN MIT
          - Ein Computer, kein Server: Dokumentation\EINZELPLATZ-INSTALLATION.pdf
          - Mehrere Arbeitsplaetze: Dokumentation\SERVER-EINRICHTUNG-EINFACH.pdf
            auf dem Server, danach Dokumentation\NEUEN-PC-IN-5-MINUTEN.pdf an
            den Arbeitsplaetzen

          $signatur
          $hinweis
          "@ | Set-Content release-notes.txt -Encoding utf8

      - name: Version bauen
        shell: pwsh
        run: |
          ./tools/ReleaseBuilder/CreateRelease.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -ReleaseNotesFile (Join-Path $PWD 'release-notes.txt')

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::CreateRelease.ps1 ist fehlgeschlagen."
            exit $LASTEXITCODE
          }

      - name: Releaseordner für die Signatur bereitstellen
        id: artefakt
        uses: actions/upload-artifact@v4
        with:
          name: vehistra-unsigniert-${{ steps.version.outputs.version }}
          path: Release/${{ steps.version.outputs.version }}/
          retention-days: 1

      - name: Ergebnis prüfen
        shell: pwsh
        run: |
          $ordner = "Release/${{ steps.version.outputs.version }}"

          $erwartet = @(
            'Vehistra-Setup.exe',
            'Vehistra-Update.exe',
            'latest.json',
            'checksums.sha256',
            'release-notes.txt'
          )

          $fehlend = $erwartet | Where-Object { -not (Test-Path (Join-Path $ordner $_)) }

          if ($fehlend) {
            Write-Host "::error::Im Releaseordner fehlen: $($fehlend -join ', ')"
            exit 1
          }

          Get-ChildItem $ordner -Recurse -File |
            ForEach-Object { "{0,10:N0} KB  {1}" -f ($_.Length / 1KB), $_.Name }

      - name: Installationspakete signieren
        if: steps.signatur.outputs.moeglich == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.artefakt.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: Release/${{ steps.version.outputs.version }}

      - name: Alles als ZIP zusammenfassen
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          Compress-Archive -Path "Release/$version/*" -DestinationPath "Vehistra-$version.zip"

      - name: Veröffentlichung anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.name }}
          body_path: release-notes.txt
          prerelease: ${{ steps.version.outputs.prerelease }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          files: |
            Release/${{ steps.version.outputs.version }}/Vehistra-Setup.exe
            Release/${{ steps.version.outputs.version }}/Vehistra-Update.exe
            Release/${{ steps.version.outputs.version }}/latest.json
            Release/${{ steps.version.outputs.version }}/checksums.sha256
            Vehistra-${{ steps.version.outputs.version }}.zip

      - name: Releaseordner als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: vehistra-release-${{ steps.version.outputs.version }}
          path: Release/
          retention-days: 90
